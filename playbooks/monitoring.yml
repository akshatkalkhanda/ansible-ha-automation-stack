---
# monitoring.yml — Deploy Prometheus, Grafana, and node_exporter
# Usage: ansible-playbook -i inventory/hosts.ini playbooks/monitoring.yml
# Usage (tags): ansible-playbook -i inventory/hosts.ini playbooks/monitoring.yml --tags node_exporter
#               ansible-playbook -i inventory/hosts.ini playbooks/monitoring.yml --tags prometheus
#               ansible-playbook -i inventory/hosts.ini playbooks/monitoring.yml --tags grafana

- name: Deploy node_exporter on all hosts
  hosts: all
  become: true
  gather_facts: true
  tags: [node_exporter]

  roles:
    - role: node_exporter
      tags: [node_exporter]

- name: Deploy Prometheus on monitoring hosts
  hosts: monitoring
  become: true
  gather_facts: true
  tags: [prometheus]

  roles:
    - role: prometheus
      tags: [prometheus]

- name: Deploy Grafana on monitoring hosts
  hosts: monitoring
  become: true
  gather_facts: true
  tags: [grafana]

  roles:
    - role: grafana
      tags: [grafana]

---
# Keepalived role — install, configure, and enable Keepalived (VRRP)

- name: Install Keepalived package
  ansible.builtin.apt:
    name: "{{ keepalived_package }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  tags: [keepalived]

- name: Ensure Keepalived config directory exists
  ansible.builtin.file:
    path: "{{ keepalived_config_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [keepalived]

- name: Deploy HAProxy health-check script
  ansible.builtin.copy:
    dest: "{{ keepalived_check_script }}"
    content: |
      #!/bin/bash
      # Check if the target service is running
      if ! systemctl is-active --quiet {{ keepalived_check_service }}; then
          exit 1
      fi
      exit 0
    owner: root
    group: root
    mode: "0755"
  tags: [keepalived]

- name: Deploy Keepalived configuration
  ansible.builtin.template:
    src: keepalived.conf.j2
    dest: "{{ keepalived_config_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Keepalived
  tags: [keepalived]

- name: Enable and start Keepalived service
  ansible.builtin.service:
    name: "{{ keepalived_service }}"
    enabled: true
    state: started
  tags: [keepalived]

---
# node_exporter role — install and start Prometheus Node Exporter on all servers

- name: Create node_exporter system group
  ansible.builtin.group:
    name: "{{ node_exporter_group }}"
    system: true
    state: present
  tags: [node_exporter]

- name: Create node_exporter system user
  ansible.builtin.user:
    name: "{{ node_exporter_user }}"
    group: "{{ node_exporter_group }}"
    system: true
    shell: /sbin/nologin
    create_home: false
    state: present
  tags: [node_exporter]

- name: Create textfile collector directory
  ansible.builtin.file:
    path: "{{ node_exporter_textfile_collector_dir }}"
    state: directory
    owner: "{{ node_exporter_user }}"
    group: "{{ node_exporter_group }}"
    mode: "0755"
  tags: [node_exporter]

- name: Check if node_exporter binary already exists with correct version
  ansible.builtin.command:
    cmd: "{{ node_exporter_install_dir }}/node_exporter --version"
  register: _node_exporter_version_check
  changed_when: false
  failed_when: false
  # Run regardless of check mode so the 'when' guard below always has a valid result
  check_mode: false
  tags: [node_exporter]

- name: Download and install node_exporter binary
  block:
    - name: Download node_exporter tarball
      ansible.builtin.get_url:
        url: "{{ node_exporter_download_url }}"
        dest: "{{ node_exporter_tmp_dir }}/node_exporter-{{ node_exporter_version }}.tar.gz"
        mode: "0644"

    - name: Extract node_exporter tarball
      ansible.builtin.unarchive:
        src: "{{ node_exporter_tmp_dir }}/node_exporter-{{ node_exporter_version }}.tar.gz"
        dest: "{{ node_exporter_tmp_dir }}"
        remote_src: true

    - name: Install node_exporter binary
      ansible.builtin.copy:
        src: "{{ node_exporter_extract_dir }}/node_exporter"
        dest: "{{ node_exporter_install_dir }}/node_exporter"
        owner: root
        group: root
        mode: "0755"
        remote_src: true
      notify: Restart node_exporter

    - name: Cleanup downloaded tarball
      ansible.builtin.file:
        path: "{{ node_exporter_tmp_dir }}/node_exporter-{{ node_exporter_version }}.tar.gz"
        state: absent
  # Skip the install block entirely in check mode: binary paths may not exist yet,
  # causing get_url/unarchive/copy failures. The version check above (check_mode: false)
  # already reports what would happen. This keeps --check idempotent and error-free.
  when:
    - not ansible_check_mode
    - >
      (_node_exporter_version_check.rc | default(1)) != 0 or
      node_exporter_version not in (_node_exporter_version_check.stdout | default(''))
  tags: [node_exporter]

- name: Deploy node_exporter systemd unit file
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: "{{ node_exporter_systemd_unit_path }}"
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart node_exporter
  tags: [node_exporter]

- name: Enable and start node_exporter service
  ansible.builtin.systemd:
    name: "{{ node_exporter_service }}"
    enabled: true
    state: started
    daemon_reload: true
  tags: [node_exporter]

---
# node_exporter role defaults

node_exporter_version: "1.8.1"
node_exporter_arch: amd64
node_exporter_user: node_exporter
node_exporter_group: node_exporter
node_exporter_install_dir: /usr/local/bin
node_exporter_port: 9100
node_exporter_service: node_exporter
node_exporter_textfile_collector_dir: /var/lib/node_exporter/textfile_collector

# Download URL — built from versioned variables, override to use a local mirror
node_exporter_download_base_url: https://github.com/prometheus/node_exporter/releases/download
node_exporter_download_url: "{{ node_exporter_download_base_url }}/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}.tar.gz"

# Systemd unit destination path
node_exporter_systemd_unit_path: /etc/systemd/system/node_exporter.service

# Temporary directory for downloads
node_exporter_tmp_dir: /tmp

# Extract directory derived from version and arch
node_exporter_extract_dir: "{{ node_exporter_tmp_dir }}/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}"

# Extra collectors to enable (comma-separated list, empty = default set only)
node_exporter_enabled_collectors: ""

# Extra arguments for the node exporter binary
node_exporter_extra_args: ""
